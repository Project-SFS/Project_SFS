# Keep the scheme reported by an outer TLS load balancer; fall back to our own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 9021;
    server_name _;
    server_tokens off;
    # users reach the app through different addresses (public IP, VPN IP, host names, forwarded ports):
    # keep any redirect relative so it stays on the address and port the browser used
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # solution files are uploaded through /api (up to 3 files of 20 MB each)
    client_max_body_size 65m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: the app only loads its own files (fonts are bundled, no CDNs).
    #   style 'unsafe-inline' - the toast library injects <style> tags
    #   blob: frames/workers  - solution PDFs are shown from a blob URL; the PDF viewer runs a worker
    #   frame-ancestors       - nobody else may embed the site (same as X-Frame-Options)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # browser features the site never uses are switched off
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
    # isolate the site from other windows / sites (links to other sites still open normally)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # API: /api/login -> backend /login (same origin, so the login cookie needs no CORS).
    # Resolve "backend" through Docker's DNS at request time: a recreated backend container gets a
    # new IP, and a name fixed at startup would leave nginx answering 502 until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location ^~ /api/ {
        set $backend_upstream http://backend:9022;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # keep the port the browser used (e.g. <server-ip>:9021) so the backend knows the real address
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # mailing every SPOC about a new problem can take a while
        proxy_read_timeout 120s;
    }

    # ES module scripts (the PDF viewer's worker) must be served as JavaScript;
    # nginx's default mime.types does not know .mjs
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        try_files $uri =404;
    }

    # hashed build assets never change
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # client-side routes (react-router) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
